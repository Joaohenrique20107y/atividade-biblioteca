<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Leitores | Biblioteca</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="topbar"><a class="brand" href="index.html">Biblioteca</a><nav><a href="livros.html">Livros</a><a href="leitores.html">Leitores</a><a href="emprestimos.html">Empréstimos</a><a href="devolucao.html">Devoluções</a></nav></header><main class="container"><div class="page-heading"><div><p class="eyebrow">CADASTRO DE USUÁRIOS</p><h1>Leitores</h1><p>Cadastre e gerencie os leitores da biblioteca.</p></div><a class="button button-light" href="index.html">Voltar ao início</a></div>
<div id="mensagem" class="message" role="status" hidden></div>
<section class="panel"><div class="panel-heading"><h2 id="formTitulo">Cadastrar leitor</h2><span class="muted">Campos obrigatórios *</span></div><form id="formLeitor" class="form-grid"><input type="hidden" id="leitorId"><label class="field">Nome completo *<input id="nome" name="nome" maxlength="150" required></label><label class="field">E-mail *<input id="email" name="email" type="email" maxlength="180" required></label><div class="form-actions"><button class="button" type="submit" id="btnSalvar">Salvar leitor</button><button class="button button-light" type="button" id="btnCancelar" hidden>Cancelar edição</button></div></form></section>
<section class="panel"><div class="panel-heading"><h2>Leitores cadastrados</h2><button class="button button-light button-small" id="btnAtualizar" type="button">Atualizar lista</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>Ações</th></tr></thead><tbody id="listaLeitores"><tr><td colspan="4" class="empty">Carregando...</td></tr></tbody></table></div></section></main><footer>Atividade - Sistema de Biblioteca em camadas</footer><script src="js/api.js"></script><script src="js/leitores.js"></script></body></html>
